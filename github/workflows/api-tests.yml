name: API Tests
on: [push]
jobs:
  run-newman-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install -g newman newman-reporter-html
      - run: newman run "GoRest API Tests.postman_collection.json" -e "GoRest.postman_environment.example.json" --env-var "accessToken=${{ secrets.GOREST_ACCESS_TOKEN }}" --delay-request 500 -r cli,html --reporter-html-export newman-report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: newman-report.html